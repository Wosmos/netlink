# Render Blueprint for the netlink Go backend.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Render injects PORT automatically; main.go already reads it.
# Use a free web service ($0 with a card on file). For the DB use Neon
# (Render's free Postgres expires after 30 days) — set DATABASE_URL below.
services:
  - type: web
    name: netlink-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      # Set these in the Render dashboard (sync:false = not stored in git):
      - key: DATABASE_URL          # Neon Postgres (schema auto-creates on boot)
        sync: false
      - key: SUPABASE_URL          # file/voice storage
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: ALLOWED_ORIGINS       # deployed frontend origin(s)
        sync: false
      - key: APP_URL               # public frontend URL (used in emails)
        sync: false
      - key: RESEND_API_KEY        # transactional email (or use GMAIL_* vars)
        sync: false
