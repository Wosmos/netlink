# Render Blueprint for the netlink Go backend.
# Deploy: Render Dashboard -> New -> Blueprint -> pick this repo.
# Render injects PORT automatically; main.go already reads it.
services:
  - type: web
    name: netlink-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENV
        value: production
      # Set these in the Render dashboard (sync:false = not stored in git):
      - key: DATABASE_URL          # Postgres (Render Postgres or Supabase pooled URL)
        sync: false
      - key: SUPABASE_URL          # file storage
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        sync: false
      - key: ALLOWED_ORIGINS       # your deployed frontend origin(s)
        sync: false
      - key: APP_URL               # public frontend URL (used in emails)
        sync: false
      - key: RESEND_API_KEY        # transactional email (or use GMAIL_* vars)
        sync: false
